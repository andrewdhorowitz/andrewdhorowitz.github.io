# Sanitize gate — public and demo surfaces must be PUBLIC AND
# GENERIC (PUBLISH-MANIFEST-SPEC, sanitization addendum): no family
# identifiers, no off-limit topics. Content that fails falls back
# to owner-only and does not ship. The checker and its term lists
# live in fleet-kit (shared infrastructure), checked out at CI
# time. The publish gate checks link PERMISSION; this checks
# CONTENT; Lychee checks liveness. All three run; none replaces
# another.
name: Sanitize gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v4
        with:
          path: site
      - name: Check out fleet-kit (checker + term lists)
        uses: actions/checkout@v4
        with:
          repository: andrewdhorowitz/fleet-kit
          path: fleet-kit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail on any family identifier or off-limit topic
        run: >
          python3 fleet-kit/scripts/check_sanitize.py
          --terms fleet-kit/scripts/sanitize_terms.json
          --root site
