# Lighthouse — repo-template kit.
# Installed to .github/workflows/lighthouse.yml by update-ci.sh
# (travels at ci-src/ for the same reason as ci.yml — see
# BOOTSTRAP-NOTES.md).
#
# Weekly + on-demand audit of the project's PUBLIC page with
# Lighthouse CI, in REPORT-ONLY mode: no assertions are configured,
# so this workflow never fails a build. The report is uploaded as a
# run artifact and to temporary public storage (linked from the run
# summary) for a human to read.
#
# Showcase staging note: the URL below is PRESET to this project's
# public page, https://andrewdhorowitz.com/ (the showcase's canonical
# home; the github.io mirror serves the same page). A private or
# login-gated page CANNOT be audited this way (Lighthouse would only
# see the login wall) — that's why the private Family Cards site
# doesn't carry this file, and its public demo does.
name: Lighthouse

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse CI (report-only)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://andrewdhorowitz.com/
          uploadArtifacts: true
          temporaryPublicStorage: true
