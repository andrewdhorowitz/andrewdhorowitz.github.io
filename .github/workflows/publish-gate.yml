# Publish gate — the portfolio may never link a surface a fleet
# manifest has declared private (PUBLISH-MANIFEST-SPEC §4).
# The denylist comes from fleet-kit's GENERATED private-hosts index,
# checked out at CI time. The index is produced by fleet-kit's pull
# tooling from each project's own publish.json (one project = one
# repo — manifests are never copied), and it carries only host
# strings, so this public repo's CI never needs to read a private
# repo. Lychee (links.yml) checks liveness; this checks permission.
# Both run; neither replaces the other.
name: Publish gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v4
        with:
          path: site
      - name: Check out fleet-kit (schema + generated index home)
        uses: actions/checkout@v4
        with:
          repository: andrewdhorowitz/fleet-kit
          path: fleet-kit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail on any href to a declared-private host
        run: >
          python3 site/scripts/check_publish_gate.py
          --index fleet-kit/publish-registry/private-hosts.json
          --root site
